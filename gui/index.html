<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopied Archive Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 31, 48, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --card-hover-border: rgba(255, 255, 255, 0.3);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-tertiary: #6b7280;
            --accent-color: #3b82f6;
            --tag-text: #4f46e5;
            --tag-image: #0891b2;
            --tag-screenshot: #9333ea;
            --glass-bg: rgba(15, 23, 42, 0.85);
            --toast-bg: rgba(30, 41, 59, 0.95);
            --focus-ring: 0 0 0 2px rgba(59, 130, 246, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Focus outlines */
        :focus-visible {
            outline: none;
            box-shadow: var(--focus-ring);
            border-radius: 4px;
        }

        /* Layout */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            padding: 1rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .search-container {
            flex: 1;
            max-width: 600px;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .search-container input:focus {
            background: rgba(0, 0, 0, 0.5);
            border-color: var(--accent-color);
        }

        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            width: 18px;
            height: 18px;
        }
        
        .shortcut-hint {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-size: 0.7rem;
            color: var(--text-tertiary);
            pointer-events: none;
        }

        .filter-tabs {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.25rem;
        }

        .tab {
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .tab.active {
            background: rgba(59, 130, 246, 0.2);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .tab-badge {
            background: rgba(0, 0, 0, 0.3);
            padding: 0.1rem 0.4rem;
            border-radius: 10px;
            font-size: 0.75rem;
        }

        .stats-bar {
            background: rgba(0, 0, 0, 0.2);
            padding: 0.75rem 2rem;
            font-size: 0.85rem;
            color: var(--text-tertiary);
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            border-bottom: 1px solid var(--card-border);
        }

        .stats-bar span {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        main {
            padding: 2rem;
            max-width: 2560px;
            margin: 0 auto;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .date-header {
            grid-column: 1 / -1;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--card-border);
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }
        
        .date-header:first-child {
            margin-top: 0;
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.5s forwards;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .card.new-item {
            animation: highlightNew 2s forwards;
        }
        
        @keyframes highlightNew {
            0% { box-shadow: 0 0 15px var(--accent-color); border-color: var(--accent-color); }
            100% { box-shadow: none; border-color: var(--card-border); }
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--card-hover-border);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3), 0 0 10px rgba(255, 255, 255, 0.05);
        }

        .card-header {
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .kind-tag {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            letter-spacing: 0.05em;
        }
        .kind-text { background: rgba(79, 70, 229, 0.2); color: #818cf8; }
        .kind-image { background: rgba(8, 145, 178, 0.2); color: #22d3ee; }
        .kind-screenshot { background: rgba(147, 51, 234, 0.2); color: #c084fc; }

        .timestamp {
            font-size: 0.8rem;
            color: var(--text-tertiary);
        }

        .card-actions-top {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.1);
        }

        .icon-btn.favorite.active {
            color: #fbbf24;
        }
        .icon-btn.delete:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .card-content {
            padding: 1rem;
            flex: 1;
            position: relative;
        }

        .text-preview {
            font-size: 0.9rem;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 150px;
            overflow: hidden;
            position: relative;
        }

        .text-preview.truncated::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(to bottom, rgba(22, 31, 48, 0), var(--card-bg));
            pointer-events: none;
        }
        
        mark {
            background-color: rgba(251, 191, 36, 0.3);
            color: #fbbf24;
            border-radius: 2px;
            padding: 0 2px;
        }

        .image-preview {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.2);
        }

        .file-info {
            margin-top: 0.75rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            word-break: break-all;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .card-footer {
            padding: 0.75rem 1rem;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .footer-stats {
            font-size: 0.75rem;
            color: var(--text-tertiary);
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--card-hover-border);
        }
        
        .btn-primary {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: white;
        }
        
        .btn-primary:hover {
            background: #2563eb;
            border-color: #2563eb;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            width: 90%;
            max-width: 1000px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
        }

        .modal-title {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .modal-text-content {
            width: 100%;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-primary);
            background: rgba(0, 0, 0, 0.2);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .modal-image-content {
            max-width: 100%;
            max-height: calc(90vh - 150px);
            object-fit: contain;
            border-radius: 8px;
        }

        .modal-footer {
            padding: 1.25rem 1.5rem;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.02);
        }

        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: 1px solid var(--card-border);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 10;
        }
        
        .modal-nav:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .modal-prev { left: 1rem; }
        .modal-next { right: 1rem; }

        /* Toasts */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            pointer-events: none;
        }

        .toast {
            background: var(--toast-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            font-size: 0.9rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            pointer-events: auto;
        }

        .toast.show {
            transform: translateX(0);
        }
        
        .toast.fade-out {
            opacity: 0;
            transform: translateY(-10px);
        }

        .toast svg {
            width: 18px;
            height: 18px;
            color: var(--accent-color);
        }
        
        .toast.error svg {
            color: #ef4444;
        }

        /* Loading Spinner */
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        
        .loader-container {
            display: flex;
            justify-content: center;
            padding: 2rem;
            width: 100%;
            grid-column: 1 / -1;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 5rem 2rem;
            color: var(--text-tertiary);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        
        /* Utility */
        .hidden { display: none !important; }

        @media (max-width: 600px) {
            header { padding: 1rem; }
            main { padding: 1rem; }
            .grid-container { grid-template-columns: 1fr; }
            .stats-bar { padding: 0.75rem 1rem; }
            .modal-content { width: 95%; height: 95vh; max-height: 95vh; }
            .modal-nav { display: none; } /* Hide side navs on mobile, rely on swipes or bottom buttons if added */
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="logo">
                <svg viewBox="0 0 24 24"><path d="M16 1H4C2.9 1 2 1.9 2 3v14h2V3h12V1zm3 4H8C6.9 5 6 5.9 6 7v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                Kopied
            </div>
            <div class="search-container">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="search-input" placeholder="Search text, filenames, or dates..." aria-label="Search">
                <div class="shortcut-hint">/</div>
            </div>
        </div>
        <div class="filter-tabs" id="filter-tabs">
            <button class="tab active" data-filter="all">All <span class="tab-badge" id="badge-all">0</span></button>
            <button class="tab" data-filter="text">Text <span class="tab-badge" id="badge-text">0</span></button>
            <button class="tab" data-filter="image">Images <span class="tab-badge" id="badge-image">0</span></button>
            <button class="tab" data-filter="screenshot">Screenshots <span class="tab-badge" id="badge-screenshot">0</span></button>
            <button class="tab" data-filter="favorites">Favorites <span class="tab-badge" id="badge-favorites">0</span></button>
        </div>
    </header>

    <div class="stats-bar" id="stats-bar">
        <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg> <span id="stat-total">0 items</span></span>
        <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg> <span id="stat-disk">0 MB</span></span>
        <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> <span id="stat-dates">Loading...</span></span>
    </div>

    <main>
        <div class="grid-container" id="grid-container">
            <!-- Cards will be rendered here -->
            <div class="loader-container" id="initial-loader">
                <div class="loader"></div>
            </div>
        </div>
        <div id="infinite-scroll-trigger" style="height: 20px; width: 100%;"></div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <button class="modal-nav modal-prev" id="modal-prev" aria-label="Previous item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        
        <div class="modal-content" id="modal-content" role="dialog" aria-modal="true">
            <div class="modal-header">
                <div class="modal-title">
                    <span class="kind-tag" id="modal-kind-tag">TEXT</span>
                    <span class="timestamp" id="modal-timestamp">Just now</span>
                </div>
                <div class="card-actions-top">
                    <button class="icon-btn favorite" id="modal-favorite-btn" title="Toggle Favorite">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                    </button>
                    <button class="icon-btn" id="modal-close-btn" title="Close (Esc)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Modal content injected here -->
            </div>
            <div class="modal-footer" id="modal-footer">
                <!-- Action buttons injected here -->
            </div>
        </div>

        <button class="modal-nav modal-next" id="modal-next" aria-label="Next item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        // Configuration
        const API_BASE = 'http://127.0.0.1:8765';
        const BATCH_SIZE = 30;
        const POLL_INTERVAL = 5000;
        
        // State
        let allItems = [];
        let filteredItems = [];
        let displayedCount = 0;
        let currentModalIndex = -1;
        let favorites = new Set(JSON.parse(localStorage.getItem('kopied_favorites') || '[]'));
        let currentFilter = 'all';
        let searchQuery = '';
        let dataSignature = '';
        let pollingTimer = null;
        let isFetchingItems = false;
        
        // DOM Elements
        const elements = {
            grid: document.getElementById('grid-container'),
            initialLoader: document.getElementById('initialLoader'),
            scrollTrigger: document.getElementById('infinite-scroll-trigger'),
            searchInput: document.getElementById('search-input'),
            filterTabs: document.getElementById('filter-tabs'),
            statsBar: {
                total: document.getElementById('stat-total'),
                disk: document.getElementById('stat-disk'),
                dates: document.getElementById('stat-dates')
            },
            badges: {
                all: document.getElementById('badge-all'),
                text: document.getElementById('badge-text'),
                image: document.getElementById('badge-image'),
                screenshot: document.getElementById('badge-screenshot'),
                favorites: document.getElementById('badge-favorites')
            },
            modal: {
                overlay: document.getElementById('modal-overlay'),
                content: document.getElementById('modal-content'),
                kindTag: document.getElementById('modal-kind-tag'),
                timestamp: document.getElementById('modal-timestamp'),
                body: document.getElementById('modal-body'),
                footer: document.getElementById('modal-footer'),
                closeBtn: document.getElementById('modal-close-btn'),
                prevBtn: document.getElementById('modal-prev'),
                nextBtn: document.getElementById('modal-next'),
                favBtn: document.getElementById('modal-favorite-btn')
            },
            toastContainer: document.getElementById('toast-container')
        };

        // --- Initialization ---
        async function init() {
            setupEventListeners();
            await fetchStats();
            await fetchItems(true);
            setupIntersectionObserver();
            
            // Start polling
            pollingTimer = setInterval(() => fetchItems(false), POLL_INTERVAL);
        }

        // --- API Calls ---
        async function fetchStats() {
            try {
                const res = await fetch(`${API_BASE}/api/stats`);
                if (res.ok) {
                    const stats = await res.json();
                    elements.statsBar.total.textContent = `${stats.total.toLocaleString()} items`;
                    elements.statsBar.disk.textContent = `${stats.disk_usage_mb.toFixed(2)} MB`;
                    
                    if (stats.oldest && stats.newest) {
                        const oldestDate = new Date(stats.oldest * 1000).toLocaleDateString();
                        const newestDate = new Date(stats.newest * 1000).toLocaleDateString();
                        elements.statsBar.dates.textContent = oldestDate === newestDate ? oldestDate : `${oldestDate} - ${newestDate}`;
                    } else {
                        elements.statsBar.dates.textContent = 'No data';
                    }
                }
            } catch (err) {
                console.error('Failed to fetch stats:', err);
            }
        }

        async function fetchItems(initial = false) {
            if (isFetchingItems) return;
            isFetchingItems = true;
            
            try {
                const res = await fetch(`${API_BASE}/api/items`);
                if (res.ok) {
                    const items = await res.json();
                    
                    // Check signature
                    const newSig = items.length + '_' + (items[0]?.id || '');
                    if (newSig !== dataSignature) {
                        dataSignature = newSig;
                        const oldItems = allItems;
                        allItems = items;
                        updateBadges();
                        applyFilters(initial);
                        
                        // If not initial, check for new items and show toast
                        if (!initial && oldItems.length > 0 && items.length > 0) {
                            if (items[0].id !== oldItems[0].id) {
                                // Just silently update or maybe a small visual queue is handled by render
                            }
                        }
                    }
                }
            } catch (err) {
                console.error('Failed to fetch items:', err);
                if (initial) {
                    elements.grid.innerHTML = `<div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                        <h2>Connection Error</h2>
                        <p>Could not connect to Kopied backend at ${API_BASE}</p>
                    </div>`;
                }
            } finally {
                isFetchingItems = false;
            }
        }

        async function fetchTextDetail(id) {
            try {
                const res = await fetch(`${API_BASE}/api/text_detail?id=${id}`);
                if (res.ok) {
                    const data = await res.json();
                    return data.content;
                }
            } catch (err) {
                console.error('Failed to fetch text detail:', err);
                showToast('Failed to load full text', 'error');
            }
            return null;
        }

        async function deleteItem(id) {
            try {
                const res = await fetch(`${API_BASE}/api/items/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    // Remove from state
                    allItems = allItems.filter(item => item.id !== id);
                    filteredItems = filteredItems.filter(item => item.id !== id);
                    dataSignature = allItems.length + '_' + (allItems[0]?.id || '');
                    
                    // Remove from DOM with animation
                    const card = document.querySelector(`.card[data-id="${id}"]`);
                    if (card) {
                        card.style.opacity = '0';
                        card.style.transform = 'scale(0.9)';
                        setTimeout(() => {
                            card.remove();
                            updateBadges();
                            fetchStats(); // Update stats in bg
                        }, 300);
                    }
                    
                    if (elements.modal.overlay.classList.contains('active')) {
                        closeModal();
                    }
                    
                    showToast('Item deleted');
                } else {
                    showToast('Failed to delete item', 'error');
                }
            } catch (err) {
                console.error('Failed to delete:', err);
                showToast('Failed to delete item', 'error');
            }
        }

        // --- Core Logic ---
        function applyFilters(resetView = true) {
            let result = allItems;
            
            // Apply Tab Filter
            if (currentFilter !== 'all') {
                if (currentFilter === 'favorites') {
                    result = result.filter(item => favorites.has(item.id));
                } else {
                    result = result.filter(item => item.kind === currentFilter);
                }
            }
            
            // Apply Search Filter
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                result = result.filter(item => {
                    if (item.preview && item.preview.toLowerCase().includes(query)) return true;
                    if (item.filename && item.filename.toLowerCase().includes(query)) return true;
                    // Format date for searching
                    const dateStr = new Date(item.timestamp * 1000).toLocaleDateString().toLowerCase();
                    if (dateStr.includes(query)) return true;
                    return false;
                });
            }
            
            filteredItems = result;
            
            if (resetView) {
                displayedCount = 0;
                elements.grid.innerHTML = '';
                if (filteredItems.length === 0) {
                    elements.grid.innerHTML = `<div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <h2>No items found</h2>
                        <p>Try adjusting your search or filters</p>
                    </div>`;
                } else {
                    renderNextBatch();
                }
            } else {
                // Non-reset view (polling update)
                // Naive approach for simplicity: just re-render fully if we are at top, otherwise leave it.
                // A robust approach would diff the DOM, but re-rendering top is safer for this scope.
                if (window.scrollY < 100) {
                    const currentDisplayed = displayedCount;
                    displayedCount = 0;
                    elements.grid.innerHTML = '';
                    renderBatch(Math.max(currentDisplayed, BATCH_SIZE));
                }
            }
        }

        function updateBadges() {
            elements.badges.all.textContent = allItems.length;
            elements.badges.text.textContent = allItems.filter(i => i.kind === 'text').length;
            elements.badges.image.textContent = allItems.filter(i => i.kind === 'image').length;
            elements.badges.screenshot.textContent = allItems.filter(i => i.kind === 'screenshot').length;
            elements.badges.favorites.textContent = allItems.filter(i => favorites.has(i.id)).length;
        }

        // --- Rendering ---
        function renderNextBatch() {
            renderBatch(BATCH_SIZE);
        }
        
        function renderBatch(size) {
            const fragment = document.createDocumentFragment();
            const endIndex = Math.min(displayedCount + size, filteredItems.length);
            
            let lastDateStr = displayedCount > 0 ? getDateGroupString(filteredItems[displayedCount - 1].timestamp) : null;
            
            for (let i = displayedCount; i < endIndex; i++) {
                const item = filteredItems[i];
                
                // Check if we need a date header
                const currentDateStr = getDateGroupString(item.timestamp);
                if (currentDateStr !== lastDateStr) {
                    const header = document.createElement('div');
                    header.className = 'date-header';
                    header.textContent = currentDateStr;
                    fragment.appendChild(header);
                    lastDateStr = currentDateStr;
                }
                
                fragment.appendChild(createCard(item, i));
            }
            
            elements.grid.appendChild(fragment);
            displayedCount = endIndex;
        }

        function createCard(item, index) {
            const card = document.createElement('div');
            card.className = `card ${Date.now() / 1000 - item.timestamp < 10 ? 'new-item' : ''}`;
            card.dataset.id = item.id;
            card.dataset.index = index;
            // Delay animation slightly based on index in current batch
            card.style.animationDelay = `${(index % BATCH_SIZE) * 0.03}s`;
            
            const isFav = favorites.has(item.id);
            const timeStr = timeAgo(item.timestamp);
            const fullDate = new Date(item.timestamp * 1000).toLocaleString();
            
            const kindClass = `kind-${item.kind}`;
            
            let contentHtml = '';
            let footerStatsHtml = '';
            
            if (item.kind === 'text') {
                const highlightedPreview = highlightText(item.preview);
                contentHtml = `<div class="text-preview ${item.is_truncated ? 'truncated' : ''}">${highlightedPreview}</div>`;
                footerStatsHtml = `${item.char_count ? item.char_count.toLocaleString() : 0} chars`;
            } else {
                const mediaUrl = `${API_BASE}/api/media?path=${encodeURIComponent(item.path)}`;
                contentHtml = `
                    <img src="${mediaUrl}" alt="preview" class="image-preview" loading="lazy">
                    <div class="file-info">${highlightText(item.filename || 'image')}</div>
                `;
                // Maybe resolution or size if available, fallback to empty
                footerStatsHtml = `Image`;
            }
            
            card.innerHTML = `
                <div class="card-header">
                    <div class="card-meta">
                        <span class="kind-tag ${kindClass}">${item.kind}</span>
                        <span class="timestamp" title="${fullDate}">${timeStr}</span>
                    </div>
                    <div class="card-actions-top">
                        <button class="icon-btn favorite ${isFav ? 'active' : ''}" data-action="fav" title="Toggle Favorite">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                        </button>
                        <button class="icon-btn delete" data-action="delete" title="Delete">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </div>
                </div>
                <div class="card-content" data-action="open">
                    ${contentHtml}
                </div>
                <div class="card-footer">
                    <span class="footer-stats">${footerStatsHtml}</span>
                    <button class="btn copy-btn" data-action="copy">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        Copy
                    </button>
                </div>
            `;
            
            // Event Delegation handled on grid, but attach data-id to buttons
            const actions = card.querySelectorAll('[data-action]');
            actions.forEach(el => {
                el.addEventListener('click', (e) => handleCardAction(e, el.dataset.action, item, index));
            });
            
            return card;
        }

        // --- Actions ---
        async function handleCardAction(e, action, item, index) {
            e.stopPropagation();
            
            if (action === 'open') {
                openModal(index);
            } else if (action === 'copy') {
                await copyItem(item);
            } else if (action === 'fav') {
                toggleFavorite(item.id, e.currentTarget);
            } else if (action === 'delete') {
                if (confirm('Are you sure you want to delete this item?')) {
                    deleteItem(item.id);
                }
            }
        }

        async function copyItem(item) {
            try {
                if (item.kind === 'text') {
                    let textToCopy = item.preview;
                    if (item.is_truncated) {
                        const btn = event.currentTarget;
                        const originalText = btn.innerHTML;
                        btn.innerHTML = '<div class="loader" style="width:14px;height:14px;border-width:2px"></div>';
                        textToCopy = await fetchTextDetail(item.id);
                        btn.innerHTML = originalText;
                    }
                    if (textToCopy) {
                        await navigator.clipboard.writeText(textToCopy);
                        showToast('Text copied to clipboard');
                    }
                } else {
                    const btn = event.currentTarget;
                    const originalText = btn.innerHTML;
                    btn.innerHTML = '<div class="loader" style="width:14px;height:14px;border-width:2px"></div>';
                    
                    const mediaUrl = `${API_BASE}/api/media?path=${encodeURIComponent(item.path)}`;
                    const response = await fetch(mediaUrl);
                    const blob = await response.blob();
                    
                    // Determine correct mime type based on extension or fallback to png
                    let mimeType = blob.type;
                    if (!mimeType || mimeType === 'application/octet-stream') {
                        mimeType = item.filename?.toLowerCase().endsWith('.jpg') ? 'image/jpeg' : 'image/png';
                    }
                    
                    // Create a new blob with the explicit mime type for clipboard
                    const clipboardBlob = new Blob([blob], { type: mimeType });
                    
                    await navigator.clipboard.write([
                        new ClipboardItem({ [mimeType]: clipboardBlob })
                    ]);
                    
                    btn.innerHTML = originalText;
                    showToast('Image copied to clipboard');
                }
            } catch (err) {
                console.error('Copy failed:', err);
                showToast('Failed to copy. Try downloading instead.', 'error');
            }
        }

        function toggleFavorite(id, btnElement) {
            if (favorites.has(id)) {
                favorites.delete(id);
                if (btnElement) {
                    btnElement.classList.remove('active');
                    btnElement.querySelector('svg').setAttribute('fill', 'none');
                }
            } else {
                favorites.add(id);
                if (btnElement) {
                    btnElement.classList.add('active');
                    btnElement.querySelector('svg').setAttribute('fill', 'currentColor');
                }
            }
            localStorage.setItem('kopied_favorites', JSON.stringify([...favorites]));
            updateBadges();
            
            // If we are currently filtering by favorites, remove the card dynamically
            if (currentFilter === 'favorites' && !favorites.has(id)) {
                const card = document.querySelector(`.card[data-id="${id}"]`);
                if (card) {
                    card.style.opacity = '0';
                    setTimeout(() => card.remove(), 300);
                }
                // Update filteredItems array to keep sync for modal prev/next
                filteredItems = filteredItems.filter(i => i.id !== id);
            }
        }

        // --- Modal ---
        async function openModal(index) {
            if (index < 0 || index >= filteredItems.length) return;
            
            currentModalIndex = index;
            const item = filteredItems[index];
            
            // Update Header
            elements.modal.kindTag.textContent = item.kind;
            elements.modal.kindTag.className = `kind-tag kind-${item.kind}`;
            elements.modal.timestamp.textContent = `${new Date(item.timestamp * 1000).toLocaleString()}`;
            
            const isFav = favorites.has(item.id);
            elements.modal.favBtn.classList.toggle('active', isFav);
            elements.modal.favBtn.querySelector('svg').setAttribute('fill', isFav ? 'currentColor' : 'none');
            
            // Update Body
            elements.modal.body.innerHTML = '<div class="loader" style="margin-top: 2rem;"></div>';
            elements.modal.footer.innerHTML = '';
            
            elements.modal.overlay.classList.add('active');
            document.body.style.overflow = 'hidden'; // Prevent bg scrolling
            
            // Navigation state
            elements.modal.prevBtn.style.opacity = index > 0 ? '1' : '0.3';
            elements.modal.prevBtn.style.pointerEvents = index > 0 ? 'auto' : 'none';
            elements.modal.nextBtn.style.opacity = index < filteredItems.length - 1 ? '1' : '0.3';
            elements.modal.nextBtn.style.pointerEvents = index < filteredItems.length - 1 ? 'auto' : 'none';
            
            // Render Content
            if (item.kind === 'text') {
                let text = item.preview;
                if (item.is_truncated) {
                    text = await fetchTextDetail(item.id) || text;
                }
                elements.modal.body.innerHTML = `<div class="modal-text-content">${escapeHTML(text)}</div>`;
                
                elements.modal.footer.innerHTML = `
                    <button class="btn btn-primary" id="modal-action-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        Copy Full Text
                    </button>
                `;
            } else {
                const mediaUrl = `${API_BASE}/api/media?path=${encodeURIComponent(item.path)}`;
                elements.modal.body.innerHTML = `<img src="${mediaUrl}" alt="Full size" class="modal-image-content">`;
                
                elements.modal.footer.innerHTML = `
                    <a href="${mediaUrl}" download="${item.filename}" class="btn" style="text-decoration: none;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Download
                    </a>
                    <button class="btn btn-primary" id="modal-action-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        Copy Image
                    </button>
                `;
            }
            
            // Attach footer action event
            const actionBtn = document.getElementById('modal-action-btn');
            if (actionBtn) {
                actionBtn.addEventListener('click', () => {
                    copyItem(item);
                });
            }
            
            // Update Fav button event specifically for modal
            elements.modal.favBtn.onclick = () => {
                toggleFavorite(item.id, elements.modal.favBtn);
                // Sync the card in background
                const cardFav = document.querySelector(`.card[data-id="${item.id}"] .favorite`);
                if (cardFav) {
                    const nowFav = favorites.has(item.id);
                    cardFav.classList.toggle('active', nowFav);
                    cardFav.querySelector('svg').setAttribute('fill', nowFav ? 'currentColor' : 'none');
                }
            };
        }

        function closeModal() {
            elements.modal.overlay.classList.remove('active');
            document.body.style.overflow = '';
            currentModalIndex = -1;
        }

        // --- Helpers ---
        function setupEventListeners() {
            // Tabs
            elements.filterTabs.addEventListener('click', (e) => {
                const tab = e.target.closest('.tab');
                if (!tab) return;
                
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                currentFilter = tab.dataset.filter;
                applyFilters();
            });
            
            // Search Debounce
            let timeout = null;
            elements.searchInput.addEventListener('input', (e) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    searchQuery = e.target.value;
                    applyFilters();
                }, 300);
            });
            
            // Keyboard Shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (elements.modal.overlay.classList.contains('active')) {
                        closeModal();
                    } else if (document.activeElement === elements.searchInput) {
                        elements.searchInput.blur();
                    }
                }
                
                if (e.key === '/' && document.activeElement !== elements.searchInput) {
                    e.preventDefault();
                    elements.searchInput.focus();
                }
                
                if (elements.modal.overlay.classList.contains('active')) {
                    if (e.key === 'ArrowRight') {
                        openModal(currentModalIndex + 1);
                    } else if (e.key === 'ArrowLeft') {
                        openModal(currentModalIndex - 1);
                    }
                }
            });
            
            // Modal Navigation Clicks
            elements.modal.prevBtn.addEventListener('click', () => openModal(currentModalIndex - 1));
            elements.modal.nextBtn.addEventListener('click', () => openModal(currentModalIndex + 1));
            elements.modal.closeBtn.addEventListener('click', closeModal);
            elements.modal.overlay.addEventListener('click', (e) => {
                if (e.target === elements.modal.overlay) closeModal();
            });
        }

        function setupIntersectionObserver() {
            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting && displayedCount < filteredItems.length) {
                    renderNextBatch();
                }
            }, { rootMargin: '200px' });
            
            observer.observe(elements.scrollTrigger);
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icon = type === 'success' 
                ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>'
                : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';
                
            toast.innerHTML = `${icon} <span>${message}</span>`;
            
            elements.toastContainer.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => toast.classList.add('show'), 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function timeAgo(timestamp) {
            const seconds = Math.floor(Date.now() / 1000 - timestamp);
            
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + " years ago";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + " months ago";
            interval = seconds / 86400;
            if (interval >= 1) return Math.floor(interval) + (Math.floor(interval) === 1 ? " day ago" : " days ago");
            interval = seconds / 3600;
            if (interval >= 1) return Math.floor(interval) + (Math.floor(interval) === 1 ? " hour ago" : " hours ago");
            interval = seconds / 60;
            if (interval >= 1) return Math.floor(interval) + " minutes ago";
            return "Just now";
        }
        
        function getDateGroupString(timestamp) {
            const date = new Date(timestamp * 1000);
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            
            if (date.toDateString() === today.toDateString()) {
                return "Today";
            } else if (date.toDateString() === yesterday.toDateString()) {
                return "Yesterday";
            } else {
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            }
        }

        function highlightText(text) {
            if (!text) return '';
            const escaped = escapeHTML(text);
            if (!searchQuery) return escaped;
            
            const regex = new RegExp(`(${escapeRegExp(searchQuery)})`, 'gi');
            return escaped.replace(regex, '<mark>$1</mark>');
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        
        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // Start
        init();

    </script>
</body>
</html>
